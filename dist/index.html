<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>骑士巡游 · Knight Trail</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#203d32;font:15px system-ui,sans-serif}main{max-width:1320px;margin:40px auto;padding:0 22px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce2d9;padding-bottom:24px}h1{font-size:30px;margin:5px 0}small,.muted{color:#748277}.eyebrow{font-size:11px;letter-spacing:3px}section{display:grid;grid-template-columns:minmax(0,900px) 280px;gap:32px;margin-top:30px}.card{background:#fff;border:1px solid #e0e5dc;border-radius:18px;padding:22px}button,select{font:inherit;color:inherit;background:white;border:1px solid #dce2d9;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{background:#eef4eb}button:disabled{opacity:.4;cursor:default}.primary,.active{background:#234f3b;color:white}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}#board{display:grid;aspect-ratio:1;gap:5px;width:100%;background:#e5e9e0;padding:5px;border-radius:10px}.cell{padding:0;border:0;border-radius:5px;position:relative;aspect-ratio:1;background:white;font-size:clamp(20px,4vw,36px);display:flex;align-items:center;justify-content:center}.visited{background:#a5cba7}.current{background:#35694a;color:white}.legal:after{content:'';width:12px;height:12px;border-radius:50%;background:#b5c7ac}.order{position:absolute;left:6px;bottom:4px;font-size:11px;opacity:.8}.flag{position:absolute;right:4px;top:2px;font-size:20px;line-height:1.1;display:flex;flex-direction:column;align-items:center}.flag b{font-size:11px;color:#8b590e;background:#fff1cf;border-radius:4px;padding:1px 4px}.stats{display:flex;justify-content:space-between;margin:22px 0}.num{font-size:30px;font-variant-numeric:tabular-nums}h3{font-size:15px;margin:0 0 12px}p{line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap}.progress{height:5px;background:#edf0e9;border-radius:5px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:#497e50}#status{min-height:48px}#history{max-height:140px;overflow:auto;font-size:12px;line-height:2;color:#6d7f70}.legend{display:flex;gap:16px;font-size:12px;margin-top:16px;color:#748277}.dot{display:inline-block;width:9px;height:9px;background:#a5cba7;margin-right:5px}.note{font-size:13px;color:#768273}.mode{margin-top:22px}footer{margin:28px 0;color:#8b978d;font-size:12px}@media(max-width:800px){main{margin:22px auto}section{grid-template-columns:1fr;gap:16px}.card{padding:16px}header .muted{display:none}.cell{font-size:30px}h1{font-size:26px}}
#board{grid-auto-rows:1fr}.cell{min-width:0;min-height:0}.cell:hover{background:#fff}.cell.visited:hover{background:#a5cba7}.cell.current:hover{background:#35694a}#board.large{gap:3px}#board.large .cell{font-size:clamp(16px,3vw,30px)}#board.large .order{left:2px;bottom:1px;font-size:9px}#board.large .flag{font-size:15px;right:1px}#board.large .flag b{font-size:9px;padding:0 2px}@media(max-width:420px){#board.large{gap:2px;padding:3px}#board.large .order{font-size:8px}#board.large .legal:after{width:7px;height:7px}}</style><main><header><div><small class="eyebrow">KNIGHT TRAIL / 棋盘上的漫游</small><h1>骑士巡游</h1></div><span class="muted">一步一格，走遍每一种可能。</span></header><section><div class="card"><div class="bar"><select id="size" aria-label="棋盘大小"><option value="4">4 × 4 · 探索</option><option value="5" selected>5 × 5</option><option value="6">6 × 6</option><option value="7">7 × 7</option><option value="8">8 × 8</option><option value="9">9 × 9</option><option value="10">10 × 10</option><option value="11">11 × 11</option><option value="12">12 × 12</option></select><span id="modeLabel" class="muted">正式行走</span></div><div id="board" aria-label="骑士巡游棋盘"></div><div class="legend"><span><i class="dot" style="background:white;border:1px solid #ccc"></i>未访问</span><span><i class="dot"></i>已访问</span><span>● 可走位置</span></div></div><aside><div class="card"><small class="eyebrow">本次旅程</small><div class="stats"><div><small>移动步数</small><div class="num" id="steps">0</div></div><div><small>用时</small><div class="num" id="time">00:00</div></div></div><div id="count"></div><div class="progress"><i id="progress"></i></div><p id="status" role="status" aria-live="polite"></p><div class="controls"><button id="undo">↶ 撤销</button><button id="pause">暂停</button><button id="reset">重置</button></div><div class="mode"><h3>⚑ 插旗推演</h3><p class="note">独立标记你的计划。点击格子插旗，再次点击移除，编号随顺序更新。</p><div class="controls"><button id="flagmode">开启插旗</button><button id="clear">清空旗帜</button></div></div></div><div class="card" style="margin-top:16px"><h3>行走记录</h3><div id="history">等待第一步</div><p class="note" id="help">任选一格出发，按“日”字移动，每格只能访问一次。绿色格中的数字为访问顺序。</p></div></aside></section><footer>慢慢思考，自由探索。起点计为访问第 1 格，移动步数从 0 开始。</footer></main><script>
let n=5,path=[],flags=[],flagMode=false,paused=false,elapsed=0,since=0;const $=id=>document.getElementById(id);const legal=(a,b)=>{let x=Math.abs(a%n-b%n),y=Math.abs(Math.floor(a/n)-Math.floor(b/n));return x*y===2};const moves=()=>path.length?Array.from({length:n*n},(_,i)=>i).filter(i=>!path.includes(i)&&legal(path.at(-1),i)):[];const done=()=>path.length===n*n||path.length>0&&!moves().length;function clock(){return elapsed+(since?performance.now()-since:0)}function stop(){if(since){elapsed+=performance.now()-since;since=0}}function start(){if(path.length&&!paused&&!done()&&!since)since=performance.now()}function reset(){stop();path=[];flags=[];paused=false;elapsed=0;render()}function render(){let next=moves();$('board').className=n>=8?'large':'';$('board').style.gridTemplateColumns=`repeat(${n},1fr)`;$('board').innerHTML='';for(let i=0;i<n*n;i++){let b=document.createElement('button'),idx=path.indexOf(i);b.className='cell'+(idx>=0?' visited':'')+(path.at(-1)===i?' current':'')+(!paused&&idx<0&&next.includes(i)?' legal':'');b.setAttribute('aria-label',`${String.fromCharCode(65+i%n)}${Math.floor(i/n)+1}${idx>=0?'，访问序号'+(idx+1):''}`);b.innerHTML=(path.at(-1)===i?'♞':'')+(idx>=0?`<span class="order">${idx+1}</span>`:'')+(flags.includes(i)?`<span class="flag"><b>${flags.indexOf(i)+1}</b>⚑</span>`:'');b.onclick=()=>{if(flagMode){flags.includes(i)?flags.splice(flags.indexOf(i),1):flags.push(i);render();return}if(paused||done())return;if(path.includes(i)||path.length&&!legal(path.at(-1),i)){$('status').textContent='请跳到标有圆点的未访问格。';return}path.push(i);if(done())stop();else start();render()};$('board').append(b)}$('steps').textContent=Math.max(0,path.length-1);$('count').textContent=`已访问 ${path.length} / ${n*n} 格`;$('progress').style.width=path.length/(n*n)*100+'%';$('status').textContent=paused?'已暂停 · 继续后再出发':path.length===n*n?'巡游完成！你走遍了每一格。':done()?'无路可走 · 撤销一步，试试其他方向。':path.length?'下一步，跳向圆点标记的格子。':'任选一个白色格子，开启旅程。';$('undo').disabled=!path.length||paused;$('pause').disabled=!path.length||done();$('pause').textContent=paused?'继续':'暂停';$('flagmode').className=flagMode?'active':'';$('flagmode').textContent=flagMode?'结束插旗':'开启插旗';$('modeLabel').textContent=flagMode?'插旗模式 · 不影响正式路径':'正式行走';$('history').textContent=path.length?path.map((i,k)=>`${k+1}. ${String.fromCharCode(65+i%n)}${Math.floor(i/n)+1}`).join(' → '):'等待第一步';$('help').textContent=n===4?'4×4 不存在完整骑士巡游，本棋盘仅用于探索。尝试走得更远吧。':'任选一格出发，按“日”字移动，每格只能访问一次。绿色格中的数字为访问顺序。'}$('size').onchange=e=>{n=+e.target.value;reset()};$('undo').onclick=()=>{stop();path.pop();start();render()};$('pause').onclick=()=>{paused=!paused;paused?stop():start();render()};$('reset').onclick=reset;$('flagmode').onclick=()=>{flagMode=!flagMode;render()};$('clear').onclick=()=>{flags=[];render()};setInterval(()=>{let s=Math.floor(clock()/1000);$('time').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},200);render();
</script></html>
